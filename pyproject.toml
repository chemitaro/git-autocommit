[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-autocommit"
version = "0.1.0"
description = "Generate a Conventional Commits message from the staged diff with a fast, low-cost model and commit it"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/chemitaro/git-autocommit"
Repository = "https://github.com/chemitaro/git-autocommit"
Issues = "https://github.com/chemitaro/git-autocommit/issues"

[project.scripts]
git-autocommit = "git_autocommit.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
strict_markers = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.hatch.build.targets.wheel]
packages = ["src/git_autocommit"]
