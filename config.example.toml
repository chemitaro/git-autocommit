# git-autocommit 設定ファイルの例
# 配置先: ~/.config/git-autocommit/config.toml
#
# primary が失敗したときだけ secondary で再試行します。
# provider: "codex"（codex exec）| "claude"（claude -p）
# reasoning_effort: 各 CLI が受け付ける値（どちらも low が最小）

[primary]
provider = "codex"
model = "gpt-6-luna"
reasoning_effort = "low"

[secondary]
provider = "claude"
model = "claude-haiku-5-5"
reasoning_effort = "low"

# 設定した場合だけ、Git の author/committer がこの値と一致するか確認します。
# [identity]
# name = "chemitaro"
# email = "84865385+chemitaro@users.noreply.github.com"

# メッセージの言語（既定: 日本語）
# language = "日本語"

# この値（バイト）を超える差分は、全文の代わりにファイル一覧と抜粋を渡します。
# max_diff_bytes = 250000
